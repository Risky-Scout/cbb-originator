# Environment lock for the CBB Originator data platform and models (docs/REPRODUCIBLE_ENVIRONMENT_POLICY.md §2).
# Records the CURRENT working environment (2026-10-10); it does not change it. requirements.txt stays the human summary.
[project]
name = "cbb-originator-model"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.6",
    "pyarrow==25.0.1",
    "pandas==3.0.6",
    "requests==2.34.2",
    "pytest==9.1.1",
    "pytz==2026.5",
]

[tool.uv]
package = false
# every transitive dependency pinned to the version installed in .venv (no upgrades)
constraint-dependencies = [
    "certifi==2026.7.22", "charset-normalizer==3.5.2", "idna==3.20", "iniconfig==2.3.0", "numpy==2.5.3",
    "packaging==26.3", "pluggy==1.6.0", "pygments==2.21.0", "python-dateutil==2.9.0.post0", "six==1.17.0",
    "urllib3==2.8.0", "colorama==0.4.6", "tzdata==2026.5",
]
